name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANCHOR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > anchor-release.jks

      - name: Build release APK
        env:
          ANCHOR_STORE_FILE: ${{ github.workspace }}/anchor-release.jks
          ANCHOR_STORE_PASSWORD: ${{ secrets.ANCHOR_STORE_PASSWORD }}
          ANCHOR_KEY_ALIAS: ${{ secrets.ANCHOR_KEY_ALIAS }}
          ANCHOR_KEY_PASSWORD: ${{ secrets.ANCHOR_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Extract version name from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk \
             dist/Anchor-${{ steps.version.outputs.VERSION }}.apk

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Anchor ${{ steps.version.outputs.VERSION }}
          body: |
            ## Installation

            Download the APK below and install it directly on your Android device.

            Before installing, ensure "Install from unknown sources" is enabled for your browser
            or file manager under Settings > Apps > Special app access.

            Minimum Android version: 8.0 (Oreo, API 26)
          files: dist/Anchor-${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
